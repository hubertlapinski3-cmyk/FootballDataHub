name: android-apk
on:
  push:
    paths-ignore:
      - "data/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --workspace --locked

  apk:
    needs: test
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install SDK platform, build tools and NDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-apk --locked
      - name: Build APK
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci.keystore" -alias ci -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass android -keypass android -dname "CN=DataHub CI"
          export CARGO_APK_RELEASE_KEYSTORE="$RUNNER_TEMP/ci.keystore"
          export CARGO_APK_RELEASE_KEYSTORE_PASSWORD=android
          cargo apk build -p hub-app --lib --release
      - uses: actions/upload-artifact@v4
        with:
          name: DataHub-apk
          path: target/release/apk/*.apk
          if-no-files-found: error
