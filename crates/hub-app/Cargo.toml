[package]
name = "hub-app"
version = "0.1.0"
edition = "2024"
description = "Data Hub: match analysis boards on Android and desktop (pure Rust, egui)"

[lib]
name = "hub_app"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "datahub"
path = "src/main.rs"

[[bin]]
name = "screenshot"
path = "src/bin/screenshot.rs"

[dependencies]
hub-core = { path = "../hub-core", default-features = false }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "android-native-activity", "x11", "wayland"] }
egui = "0.37.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
flate2 = "1"
log = "0.4"
chrono = "0.4"
resvg = "0.50.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"
winit = { version = "0.30", features = ["android-native-activity"] }


# ---------------------------------------------------------------- Android packaging
# cargo-apk:  cargo apk build -p hub-app --lib --release
[package.metadata.android]
package = "com.datahub.app"
apk_name = "DataHub"
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_feature]]
glEsVersion = 0x00030000
required = true

[package.metadata.android.application]
label = "Data Hub"
theme = "@android:style/Theme.Black.NoTitleBar"

[package.metadata.android.application.activity]
config_changes = "orientation|screenSize|screenLayout|keyboardHidden|keyboard|uiMode|density"
launch_mode = "singleTask"
orientation = "unspecified"
resizeable_activity = true
