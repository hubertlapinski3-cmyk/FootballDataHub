[package]
name = "hub-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
chrono = "0.4.45"
clap = { version = "4.6.10", features = ["derive"], optional = true }
image = { version = "0.25.10", default-features = false, features = ["png"] }
regex = "1.13.2"
ureq = "3.5.2"
flate2 = "1"
resvg = "0.50.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.3"


[lib]
name = "matchhub"
path = "src/lib.rs"

[[bin]]
name = "matchhub"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap"]
